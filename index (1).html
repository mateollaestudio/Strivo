  <div class="card" style="background:var(--s2);margin-top:12px;padding:12px" id="feTot"></div><button class="btn primary" style="width:100%;margin-top:14px" id="feSave">Guardar cambios</button></div></div>`);
  const $=i=>document.getElementById(i), calc=()=>{ const q=Math.max(0,parseFloat($('feQty').value)||0), f=entryFields(e.base,e.baseQty,q); $('feTot').innerHTML='<b>'+Math.round(f.kcal)+' kcal</b> · P '+fnum(f.p)+' · C '+fnum(f.c)+' · G '+fnum(f.f); return {q,f}; }; $('feQty').oninput=calc; calc();
  $('feSave').onclick=()=>{ const r=calc(); if(!(r.q>0)) return showToast('La cantidad debe ser mayor que 0'); Object.assign(e,r.f,{qty:r.q,meal:$('feMeal').value,date:$('feDate').value||e.date,qtyLabel:fmtQty(r.q,e.unit==='ración'?'ración(es)':e.unit)}); saveState(); $('foodEditModal').remove(); afterFood(); showToast('Entrada actualizada'); };
}
function dupEntry(id){ const e=foodList().find(x=>String(x.id)===String(id)); if(!e) return; const i=foodList().indexOf(e); foodList().splice(i+1,0,Object.assign({},e,{id:newId()})); saveState(); afterFood(); showToast('Entrada duplicada'); }
function delEntry(id){ const l=foodList(), i=l.findIndex(x=>String(x.id)===String(id)); if(i<0) return; const e=l[i]; if(!confirm('¿Eliminar «'+e.name+'» del diario?')) return; l.splice(i,1); saveState(); afterFood(); showToast('Entrada eliminada'); }

/* ---------- Repetir comida, combinaciones, objetivos, recetas ---------- */
function openRepeat(meal){
  const old=document.getElementById('repeatModal'); if(old) old.remove(); const start=shiftDate(diaryDate,-1);
  document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="repeatModal"><div class="modal" style="max-width:460px"><div class="mh"><h2>↺ Repetir ${esc(mealName(meal))}</h2><button class="ico" data-rp-close aria-label="Cerrar">×</button></div><div class="field"><label for="rpDate">Copiar desde el día</label><input id="rpDate" type="date" class="input" value="${start}"></div><div id="rpList" class="list" style="margin-top:10px"></div><button class="btn primary" style="width:100%;margin-top:14px" id="rpAdd">Añadir a ${esc(dLong(diaryDate))}</button></div></div>`);
  const $=i=>document.getElementById(i), items=()=>foodList().filter(f=>f.date===$('rpDate').value&&(MEALS.some(x=>x.id===f.meal)?f.meal:'otros')===meal);
  const draw=()=>{ const l=items(); $('rpList').innerHTML=l.length?l.map(e=>`<div class="row"><div class="grow"><b>${esc(e.name)}</b><div class="muted">${esc(e.qtyLabel||'')} · ${Math.round(e.kcal)} kcal</div></div></div>`).join(''):'<div class="empty">No hay alimentos de esa comida en ese día.</div>'; $('rpAdd').disabled=!l.length; };
  $('rpDate').onchange=draw; draw();
  $('rpAdd').onclick=()=>{ const l=items(); if(!l.length) return; l.forEach(e=>foodList().push(Object.assign({},e,{id:newId(),date:diaryDate,meal:meal}))); saveState(); $('repeatModal').remove(); afterFood(); showToast(l.length+' alimento(s) añadidos'); };
}
function saveCombo(meal){ const l=foodList().filter(f=>f.date===diaryDate&&(MEALS.some(x=>x.id===f.meal)?f.meal:'otros')===meal); if(!l.length) return; const name=(prompt('Nombre de la combinación (ej. «Desayuno de siempre»):',mealName(meal))||'').trim(); if(!name) return; comboList().push({id:newId(),name:name.slice(0,60),items:l.map(e=>Object.assign({},e,{id:undefined,date:undefined,meal:undefined}))}); saveState(); showToast('Combinación guardada'); }
function addCombo(id){ const cb=comboList().find(x=>x.id===id); if(!cb) return; cb.items.forEach(e=>foodList().push(Object.assign({},e,{id:newId(),date:FS?FS.date:diaryDate,meal:FS?FS.meal:mealByHour()}))); saveState(); afterFood(); showToast('Combinación añadida: '+cb.items.length+' alimentos'); }
function openGoals(){
  const old=document.getElementById('goalsModal'); if(old) old.remove(); const t=targets(), g=S.goals||{};
  document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="goalsModal"><div class="modal" style="max-width:440px"><div class="mh"><h2>⚙️ Objetivos diarios</h2><button class="ico" data-gl-close aria-label="Cerrar">×</button></div><p class="muted">Déjalos vacíos para usar el cálculo automático según tu perfil. Son orientativos y no constituyen una recomendación médica.</p>
  <div class="form" style="grid-template-columns:1fr 1fr;gap:8px">${[['glK','Calorías (kcal)',g.kcal,t.tdee],['glP','Proteínas (g)',g.p,t.protein],['glC','Hidratos (g)',g.c,t.carbs],['glF','Grasas (g)',g.f,t.fats]].map(x=>`<div class="field"><label for="${x[0]}">${x[1]}</label><input id="${x[0]}" type="number" min="0" class="input" inputmode="decimal" value="${x[2]||''}" placeholder="Auto: ${x[3]}"></div>`).join('')}</div>
  <div class="acts" style="margin-top:14px"><button class="btn primary" style="flex:1" id="glSave">Guardar</button><button class="btn" id="glReset">Usar automático</button></div></div></div>`);
  const v=i=>{ const x=parseFloat(document.getElementById(i).value); return x>0?x:0; };
  document.getElementById('glSave').onclick=()=>{ S.goals={kcal:v('glK'),p:v('glP'),c:v('glC'),f:v('glF')}; saveState(); document.getElementById('goalsModal').remove(); afterFood(); showToast('Objetivos guardados'); };
  document.getElementById('glReset').onclick=()=>{ S.goals={}; saveState(); document.getElementById('goalsModal').remove(); afterFood(); showToast('Objetivos automáticos'); };
}
function openRecipeAdd(i){
  const x=NUTRITION_DB[i]; if(!x) return; const old=document.getElementById('recipeAddModal'); if(old) old.remove(); const n=(S.servings||{})[i]||S.defServ||1;
  document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="recipeAddModal"><div class="modal" style="max-width:440px"><div class="mh"><h2>🍲 Añadir receta</h2><button class="ico" data-rc-close aria-label="Cerrar">×</button></div><b>${esc(x[0])}</b><div class="muted">Valores estimados de la receta, no de una etiqueta comercial.</div>
  <div class="form" style="grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><div class="field"><label for="rcN">Raciones</label><input id="rcN" type="number" min="0.25" step="0.25" class="input" value="${n}"></div><div class="field"><label for="rcMeal">Comida</label><select id="rcMeal" class="select">${mealOptions(mealByHour())}</select></div></div>
  <div class="field" style="margin-top:8px"><label for="rcDate">Fecha</label><input id="rcDate" type="date" class="input" value="${diaryDate}"></div><div class="card" style="background:var(--s2);margin-top:12px;padding:12px" id="rcTot"></div><button class="btn primary" style="width:100%;margin-top:14px" id="rcAdd">＋ Añadir al diario</button></div></div>`);
  const $=id=>document.getElementById(id), b=x[6]||{p:0,c:0,f:0,kcal:0}, base={k:b.kcal,p:b.p,c:b.c,f:b.f,sat:null,sug:null,fib:null,salt:null}, calc=()=>{ const q=Math.max(0,parseFloat($('rcN').value)||0), f=entryFields(base,1,q); $('rcTot').innerHTML='<b>'+Math.round(f.kcal)+' kcal</b> · P '+fnum(f.p)+' · C '+fnum(f.c)+' · G '+fnum(f.f); return {q,f}; }; $('rcN').oninput=calc; calc();
  $('rcAdd').onclick=()=>{ const r=calc(); if(!(r.q>0)) return showToast('Indica las raciones'); const d=$('rcDate').value||diaryDate; foodList().push(Object.assign({id:newId(),date:d,meal:$('rcMeal').value,name:x[0],brand:'',src:'receta',srcLabel:SRC_LABEL.receta,reliability:'Estimado a partir de la receta',base:base,baseQty:1,unit:'ración',qty:r.q,qtyLabel:fmtQty(r.q,'ración(es)'),meta:{}},r.f)); saveState(); diaryDate=d; $('recipeAddModal').remove(); afterFood(); showToast('Receta añadida al diario'); };
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-fd-add],[data-fd-day],[data-fd-edit],[data-fd-dup],[data-fd-del],[data-fd-repeat],[data-fd-combo],[data-fd-goals],[data-fd-close],[data-fe-close],[data-rp-close],[data-gl-close],[data-rc-close],[data-fs-close],[data-fs-pick],[data-fs-tab],[data-fs-manual],[data-fs-off],[data-fs-nosplit],[data-fs-combo-add],[data-fs-combo-del]'); if(!t) return; const d=t.dataset;
  const close=id=>{ const m=document.getElementById(id); if(m) m.remove(); };
  if(d.fdAdd!==undefined) openFoodAdd(d.fdAdd);
  else if(d.fdDay!==undefined){ diaryDate=d.fdDay==='today'?localISO():shiftDate(diaryDate,+d.fdDay); refreshDiary(); }
  else if(d.fdEdit) openFoodEdit(d.fdEdit);
  else if(d.fdDup) dupEntry(d.fdDup);
  else if(d.fdDel) delEntry(d.fdDel);
  else if(d.fdRepeat) openRepeat(d.fdRepeat);
  else if(d.fdCombo) saveCombo(d.fdCombo);
  else if('fdGoals' in d) openGoals();
  else if('fdClose' in d) close('foodDetailModal'); else if('feClose' in d) close('foodEditModal'); else if('rpClose' in d) close('repeatModal'); else if('glClose' in d) close('goalsModal'); else if('rcClose' in d) close('recipeAddModal'); else if('fsClose' in d) close('foodAddModal');
  else if(d.fsPick!==undefined){ const it=FS&&FS.pool[+d.fsPick]; if(it) openFoodDetail(it.c,it.p,{meal:FS.meal,date:FS.date}); }
  else if(d.fsTab){ FS.tab=d.fsTab; renderFsHome(); }
  else if('fsManual' in d) openFoodManual();
  else if('fsOff' in d) runSearch(true);
  else if('fsNosplit' in d){ FS.noSplit=true; runSearch(true); }
  else if(d.fsComboAdd) addCombo(d.fsComboAdd);
  else if(d.fsComboDel){ S.combos=comboList().filter(x=>x.id!==d.fsComboDel); saveState(); renderFsHome(); }
});
document.addEventListener('change',e=>{ if(e.target.id==='fdDate'&&e.target.value){ diaryDate=e.target.value; refreshDiary(); } });

/* ===== PRO · ESCÁNER DE CÓDIGO DE BARRAS + OPEN FOOD FACTS ===== */
let SCAN=null; KEEP.push('scanModal');
function loadH5(){
  if(window.Html5Qrcode) return Promise.resolve();
  return window._h5||(window._h5=new Promise((ok,no)=>{
    const urls=['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.4/html5-qrcode.min.js','https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js']; let i=0;
    const next=()=>{ if(i>=urls.length){ window._h5=null; return no(new Error('cdn')); } const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>window.Html5Qrcode?ok():next(); s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); };
    next(); }));
}
function scanMsg(t,bad){ const e=document.getElementById('scanMsg'); if(e){ e.textContent=t; e.style.color=bad?'#ef4444':''; } }
function openScanner(){
  if(document.getElementById('scanModal')) return;
  document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="scanModal"><div class="modal" style="max-width:520px"><div class="mh"><h2>📷 Escanear producto</h2><button class="ico" data-scan-close title="Cerrar" aria-label="Cerrar">×</button></div>
  <p class="muted" id="scanMsg">Iniciando cámara…</p>
  <div class="scanbox" id="scanBox"><video id="scanVideo" playsinline muted autoplay></video><div class="scanline"></div></div><div id="scanReader" style="display:none"></div>
  <div class="acts"><label class="btn" style="cursor:pointer">🖼 Foto del código<input type="file" accept="image/*" capture="environment" id="scanFile" hidden></label><button class="btn" id="scanRetry" style="display:none">🔄 Reintentar cámara</button></div>
  <div class="field" style="margin-top:14px"><label>O escribe el código de barras</label><div class="search" style="margin:0"><input id="scanCode" class="input" inputmode="numeric" placeholder="Ej. 5449000000996"><button class="btn primary" id="scanGo">Buscar</button></div></div>
  <p class="muted" style="font-size:11px;margin-top:10px">Datos nutricionales de Open Food Facts (por 100 g). La cámara requiere HTTPS y tu permiso.</p></div></div>`);
  document.getElementById('scanGo').onclick=()=>{ const v=document.getElementById('scanCode').value; if(v.replace(/\D/g,'').length<6) return scanMsg('Introduce un código válido (6-14 dígitos)',1); stopScan(); lookupProduct(v); };
  document.getElementById('scanCode').onkeydown=e=>{ if(e.key==='Enter') document.getElementById('scanGo').click(); };
  document.getElementById('scanRetry').onclick=()=>{ document.getElementById('scanRetry').style.display='none'; startScan(); };
  document.getElementById('scanFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; scanMsg('Analizando foto…'); stopScan();
    try{ let code=null;
      if('BarcodeDetector' in window){ const det=new BarcodeDetector(), bmp=await createImageBitmap(f), r=await det.detect(bmp); if(r[0]) code=r[0].rawValue; }
      if(!code){ await loadH5(); const q=new Html5Qrcode('scanReader'), r=await q.scanFile(f,false); code=r; try{ q.clear(); }catch(_){} }
      if(code) lookupProduct(code); else throw 0;
    }catch(_){ scanMsg('No se ha detectado ningún código en la foto. Prueba de nuevo o escríbelo.',1); document.getElementById('scanRetry').style.display=''; } e.target.value=''; };
  startScan();
}
async function startScan(){
  stopScan(); const video=document.getElementById('scanVideo'); if(!video) return; SCAN={found:false};
  const box=document.getElementById('scanBox'), rd=document.getElementById('scanReader'); box.style.display=''; rd.style.display='none';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||window.isSecureContext===false){ scanMsg('La cámara no está disponible aquí (hace falta HTTPS). Usa la foto o escribe el código.',1); box.style.display='none'; return; }
  try{
    if('BarcodeDetector' in window){
      let fm=['ean_13','ean_8','upc_a','upc_e','code_128','code_39']; try{ const sp=await BarcodeDetector.getSupportedFormats(); fm=fm.filter(f=>sp.includes(f)); }catch(_){}
      if(fm.length){
        const det=new BarcodeDetector({formats:fm}), stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
        if(!document.getElementById('scanModal')){ stream.getTracks().forEach(t=>t.stop()); return; }
        SCAN.stream=stream; video.srcObject=stream; await video.play(); scanMsg('Apunta al código de barras del envase…');
        SCAN.timer=setInterval(async()=>{ if(SCAN&&SCAN.busy||video.readyState<2) return; SCAN.busy=true; try{ const r=await det.detect(video); if(r&&r[0]&&SCAN&&!SCAN.found) onScanCode(r[0].rawValue); }catch(_){} if(SCAN) SCAN.busy=false; },250);
        return; } }
    await loadH5(); box.style.display='none'; rd.style.display='';
    const F=Html5QrcodeSupportedFormats, q=new Html5Qrcode('scanReader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39],verbose:false}); SCAN.q=q;
    await q.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(300,Math.round(w*.85)),height:Math.min(150,Math.round(h*.6))})},c=>onScanCode(c),()=>{});
    scanMsg('Apunta al código de barras del envase…');
  }catch(err){
    box.style.display='none'; const n=err&&err.name||'';
    scanMsg(n==='NotAllowedError'||/permission|denied/i.test(String(err))?'Permiso de cámara denegado. Actívalo en el navegador o usa la foto / el código manual.':'No se pudo iniciar la cámara o cargar el lector. Usa la foto o escribe el código.',1);
    document.getElementById('scanRetry').style.display='';
  }
}
function stopScan(){
  if(!SCAN) return; clearInterval(SCAN.timer); if(SCAN.stream) SCAN.stream.getTracks().forEach(t=>t.stop());
  if(SCAN.q){ const q=SCAN.q; q.stop().then(()=>{ try{ q.clear(); }catch(_){} }).catch(()=>{}); }
  const v=document.getElementById('scanVideo'); if(v) v.srcObject=null; SCAN=null;
}
function closeScan(){ stopScan(); const m=document.getElementById('scanModal'); if(m) m.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('scanModal')) closeScan(); });
function offerManual(code){ const acts=document.querySelector('#scanModal .acts'); if(!acts||document.getElementById('scanManual')) return; const b=document.createElement('button'); b.className='btn primary'; b.id='scanManual'; b.textContent='✍️ Introducir manualmente'; b.onclick=()=>{ closeScan(); openFoodDetail({kind:'manual',name:'',barcode:code,base:{k:null,p:null,c:null,f:null,sat:null,sug:null,fib:null,salt:null},baseQty:100,unit:'g',src:'manual',srcLabel:SRC_LABEL.manual,reliability:'Introducido por ti'},null,{meal:mealByHour(),date:diaryDate}); }; acts.appendChild(b); }
function onScanCode(code){ if(!SCAN||SCAN.found) return; SCAN.found=true; buzz([60,40,60]); beep(); const c=String(code); stopScan(); lookupProduct(c); }
async function lookupProduct(raw){
  const code=String(raw).replace(/\D/g,''); if(code.length<6) return scanMsg('Código no válido',1);
  scanMsg('Buscando '+code+' en Open Food Facts…'); const retry=document.getElementById('scanRetry'); if(retry) retry.style.display='none';
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=code,product_name,product_name_es,brands,quantity,serving_size,serving_quantity,nutriments,image_front_small_url'), j=await r.json();
    if(j.status!==1||!j.product){ scanMsg('Producto '+code+' no encontrado en Open Food Facts. Puedes añadirlo manualmente.',1); if(retry) retry.style.display=''; offerManual(code); return; }
    const m=document.getElementById('scanModal'); if(m) m.remove(); openProduct(j.product,code);
  }catch(err){ scanMsg('No se pudo consultar Open Food Facts (¿sin conexión?). Inténtalo de nuevo.',1); if(retry) retry.style.display=''; }
}
/* ===== PRO · CLICKS GLOBALES ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-scan-open],[data-scan-close],[data-food-del],[data-add-diary],[data-food-manual],[data-ix-mode],[data-ix-range]'); if(!t) return; const d=t.dataset;
  if('scanOpen' in d) openScanner();
  else if('scanClose' in d) closeScan();
  else if(d.foodDel){ delEntry(d.foodDel); }
  else if(d.addDiary!==undefined){ openRecipeAdd(+d.addDiary); }
  else if('foodManual' in d) openFoodManual();
  else if(d.ixMode||d.ixRange){
    if(d.ixMode) S.ixMode=d.ixMode; if(d.ixRange) S.ixRange=d.ixRange; saveState();
    document.querySelectorAll('[data-ix-mode]').forEach(b=>b.classList.toggle('on',b.dataset.ixMode===(S.ixMode||'both')));
    document.querySelectorAll('[data-ix-range]').forEach(b=>b.classList.toggle('on',b.dataset.ixRange===(S.ixRange||'30')));
    drawIx(-1);
  }
});

document.addEventListener('visibilitychange',()=>{ if(gps&&document.visibilityState==='visible') takeWake(); });
{ const _ra=renderApp; renderApp=function(){ _ra(); if(S.page==='outdoor') outdoorAfterRender(); if(S.page==='progress') drawProgressCharts(); if(S.page==='home') drawHomeToday(true); }; }
renderApp();

/* ===== Voces y sonidos: eventos ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-vz-say]'); if(b){ speakForce(VOICE_PHRASES[+b.dataset.vzSay]); return; }
  if(e.target.closest('#vzBeep')){ beepTest(); return; }
  if(e.target.closest('#vzReload')){ loadVoices(); const sel=document.getElementById('vzSel'); if(sel) sel.innerHTML=voiceOptionsHTML(); showToast(VOICES.length?VOICES.length+' voces en español':'No hay voces en español instaladas'); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='vzSel'){ S.voiceName=e.target.value||null; saveState(); speakForce('Hola, así sueno. ¡Vamos a entrenar!'); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='vzRate'){ S.voiceRate=+e.target.value; document.getElementById('vzRateV').textContent=S.voiceRate.toFixed(2); saveState(); }
  if(e.target.id==='vzPitch'){ S.voicePitch=+e.target.value; document.getElementById('vzPitchV').textContent=S.voicePitch.toFixed(2); saveState(); }
});
